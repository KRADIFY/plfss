server {
    listen 80;
    listen [::]:80;
    server_name plfss.lexmachine.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/plfss-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name plfss.lexmachine.net;
    ssl_certificate /etc/letsencrypt/live/plfss.lexmachine.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plfss.lexmachine.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    auth_basic off;
    # Independent PLFSS guided demo; the accounts service stays unchanged.

    # Same anonymous counter; local adapter adds demo and inherited exclusion.
    location = /activity/script.js {
        access_log off;
        alias /opt/nos-deniers/presentations/audience-20261006/tracker.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }
    location = /activity/event {
        if ($http_origin != "https://plfss.lexmachine.net") { return 403; }
        access_log off;
        client_max_body_size 4k;
        proxy_pass https://109.199.112.132;
        proxy_set_header Host auditnosdeniers.lexmachine.net;
        proxy_set_header Origin https://budget.lexmachine.net;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name auditnosdeniers.lexmachine.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
    }
    location ^~ /activity/ {
        access_log off;
        client_max_body_size 4k;
        proxy_pass https://109.199.112.132;
        proxy_set_header Host auditnosdeniers.lexmachine.net;
        proxy_set_header Origin https://budget.lexmachine.net;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name auditnosdeniers.lexmachine.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
    }
    location = /demo { return 302 /demo/; }
    location ^~ /demo/ {
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/presentation/plfss-refinements.css?v=20261006"><script src="/activity/script.js" async></script></head>';
        sub_filter '<a class="companion-link" href="https://budget.lexmachine.net/?demo=off"' '<a class="companion-link" href="https://budget.lexmachine.net/demo/"';
        proxy_pass http://127.0.0.1:18897/;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'self' https://budget.lexmachine.net/activity/exclusion-bridge; frame-ancestors 'self'; object-src 'none'; base-uri 'none'; form-action 'none'";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
    }
    # Independent static presentation files shared by the demo and main page.
    location = /demo/entry-buttons.css {
        alias /opt/plfss-demo/releases/20261006-voix/public/entry-buttons.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }
    location = /presentation/plfss-refinements.css {
        alias /opt/plfss-demo/releases/20261006-voix/public/plfss-refinements.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }
    location = / {
        # Existing automatic audits inspect the real app, without a visitor intro.
        set $nd_plfss_demo_entry $arg_demo;
        if ($http_user_agent ~* "HeadlessChrome/") { set $nd_plfss_demo_entry "off"; }
        if ($nd_plfss_demo_entry != "off") { return 302 /demo/; }
        proxy_pass http://127.0.0.1:18895;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/demo/site-button.css?v=20261006"><link rel="stylesheet" href="/demo/entry-buttons.css?v=20261006"><link rel="stylesheet" href="/presentation/plfss-refinements.css?v=20261006"><script src="/activity/script.js" async></script></head>';
        sub_filter '</a><div class="masthead-right">' '</a><a id="plfss-demo-open" class="plfss-demo-link" href="/demo/" aria-label="Démarrer la visite guidée PLFSS">▶ Démo</a><div class="masthead-right">';
        sub_filter 'href="https://budget.lexmachine.net/"' 'href="https://budget.lexmachine.net/demo/"';
        sub_filter '<a class="companion-link" href="https://budget.lexmachine.net/?demo=off"' '<a class="companion-link" href="https://budget.lexmachine.net/demo/"';
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 140s;
        proxy_send_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:18895;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/demo/site-button.css?v=20261006"><link rel="stylesheet" href="/demo/entry-buttons.css?v=20261006"><link rel="stylesheet" href="/presentation/plfss-refinements.css?v=20261006"><script src="/activity/script.js" async></script></head>';
        sub_filter '</a><div class="masthead-right">' '</a><a id="plfss-demo-open" class="plfss-demo-link" href="/demo/" aria-label="Démarrer la visite guidée PLFSS">▶ Démo</a><div class="masthead-right">';
        sub_filter 'href="https://budget.lexmachine.net/"' 'href="https://budget.lexmachine.net/demo/"';
        sub_filter '<a class="companion-link" href="https://budget.lexmachine.net/?demo=off"' '<a class="companion-link" href="https://budget.lexmachine.net/demo/"';
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 140s;
        proxy_send_timeout 30s;
    }
}
